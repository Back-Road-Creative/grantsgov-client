name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: No runtime dependencies
        # The "zero dependencies" claim is load-bearing, so it is a gate, not
        # a promise: the installed distribution must require nothing.
        run: |
          python - <<'PY'
          from importlib.metadata import requires
          runtime = [r for r in (requires("grantsgov-client") or [])
                     if "extra ==" not in r]
          assert runtime == [], runtime
          print("runtime dependencies:", runtime)
          PY
